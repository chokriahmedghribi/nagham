name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk nagham.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nagham-apk
          path: nagham.apk
      - name: Publish as GitHub Release (easy download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nagham.apk --title "Nagham (latest build)" --notes "Auto-built APK from commit ${GITHUB_SHA::7}" --prerelease
